# PyFLDPLN_src config for the Wildcat Creek AOI (bil/ input data).
# See PyFLDPLN_src/config.py for the full schema.

run:
  n_workers: null      # number of parallel worker processes (CPU cores) to use; null = os.cpu_count() auto
  use_gpu: false        # use GPU-accelerated flood-fill backend, if available (experimental)

paths:
  home_dir: /home/jsong33/Research/FLDPLN_Pyconverting/
  dem: bil/dem.bil
  fil: bil/fil.bil
  fdr: bil/fdr.bil
  fac: bil/fac.bil
  segment_raster: FLDPLN_Py/outputs/wildcat/bil/str_segid.bil
  seg_info: FLDPLN_Py/outputs/wildcat/mat/seg_info.parquet
  seed_points_shapefile: null   # required only if segmentation.method == seedpoints
  crs: null   # e.g. "EPSG:5070" -- override the input rasters' own CRS if it's missing/wrong; null = trust the .prj files as-is

segmentation:
  method: auto                   # auto | seedpoints
  stream_threshold_sqmi: 70      # strthr
  break_threshold_sqmi: 25       # facthr
  max_segment_length_mi: 5       # seglen

flood:
  fldmn: 0.01
  dh: 1
  fldmx: 15
  max_height_cap: 0    # 0 = no cap
  steady_state: true

output:
  segment_files_dir: FLDPLN_Py/outputs/wildcat/segment_files/
  map_output: FLDPLN_Py/outputs/wildcat/bil/fldpln_map.bil
