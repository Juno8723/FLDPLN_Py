[project]
name = "PyFLDPLN_src"
version = "0.1.0"
description = "Python port of the FLDPLN floodplain mapping model (Kastens 2008)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "rasterio",
    "geopandas",
    "pyyaml",
    "numba",
    "matplotlib",
    "shapely",
    "scipy",
]

[project.optional-dependencies]
gpu = ["cupy"]

[project.scripts]
pyfldpln-segmentation = "PyFLDPLN_src.cli_segmentation:main"
pyfldpln-library-reorganization = "PyFLDPLN_src.cli_library_reorganization:main"
pyfldpln-floodmap = "PyFLDPLN_src.cli_floodmap:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["PyFLDPLN_src*"]
